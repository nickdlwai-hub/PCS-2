<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEXUS // Production Quantity Reporting System</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Orbitron:wght@500;700&display=swap');

    :root {
      --bg-base: #060b14;
      --bg-panel: rgba(13, 22, 38, 0.72);
      --bg-input: rgba(7, 13, 24, 0.85);
      --border-subtle: rgba(0, 240, 255, 0.18);
      --border-glow: rgba(0, 240, 255, 0.6);
      --accent-cyan: #00f0ff;
      --accent-blue: #2563eb;
      --accent-emerald: #10b981;
      --accent-danger: #ef4444;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 15% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(37, 99, 235, 0.1) 0%, transparent 45%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 840px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 22px;
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 10;
    }

    .header::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      border-radius: 14px 14px 0 0;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan), 0 0 20px var(--accent-cyan);
      animation: pulse 2s infinite ease-in-out;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(0.85); }
    }

    .brand-text h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--text-primary);
    }

    .brand-sub {
      font-family: 'Orbitron', monospace;
      font-size: 0.72rem;
      color: var(--accent-cyan);
      letter-spacing: 0.12em;
      opacity: 0.85;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .clock {
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
    }

    .lang-select-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .lang-icon {
      position: absolute;
      left: 11px;
      pointer-events: none;
      color: var(--accent-cyan);
      width: 16px;
      height: 16px;
      z-index: 2;
    }

    select.lang-select {
      appearance: none;
      -webkit-appearance: none;
      background: var(--bg-input);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 8px 32px 8px 34px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      position: relative;
      z-index: 1;
    }

    select.lang-select option {
      background-color: #0d1626;
      color: #f1f5f9;
    }

    select.lang-select:hover,
    select.lang-select:focus {
      border-color: var(--border-glow);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }

    .lang-arrow {
      position: absolute;
      right: 10px;
      pointer-events: none;
      color: var(--text-secondary);
      width: 14px;
      height: 14px;
      z-index: 2;
    }

    /* Main Panel */
    .panel {
      background: var(--bg-panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    /* HUD Corner Brackets */
    .corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: var(--accent-cyan);
      border-style: solid;
      opacity: 0.6;
      pointer-events: none;
    }
    .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-top-left-radius: 6px; }
    .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; border-top-right-radius: 6px; }
    .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; border-bottom-left-radius: 6px; }
    .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-bottom-right-radius: 6px; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    .label-tag {
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      color: var(--accent-cyan);
      opacity: 0.75;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 10px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: 1.05rem;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
    }

    .input-field::placeholder {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .input-field:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.12), 0 0 18px rgba(0, 240, 255, 0.18);
    }

    .input-qty {
      font-family: 'Orbitron', 'Inter', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding-right: 76px;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    .unit-badge {
      position: absolute;
      right: 10px;
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 6px 12px;
      border-radius: 7px;
      letter-spacing: 0.08em;
      pointer-events: none;
    }

    .quick-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: var(--text-secondary);
      border-radius: 7px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 600;
      font-family: 'Orbitron', 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .pill-btn:hover,
    .pill-btn.active {
      background: rgba(0, 240, 255, 0.14);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.18);
    }

    .submit-btn {
      margin-top: 6px;
      width: 100%;
      padding: 15px 24px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.05em;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(0, 180, 255, 0.35);
      transition: all 0.25s ease;
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 26px rgba(0, 240, 255, 0.5);
    }

    .submit-btn:active {
      transform: translateY(1px);
    }

    /* Telemetry Log Section */
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .log-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .log-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    .stats-badge {
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 3px 10px;
      border-radius: 20px;
    }

    .log-actions {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--text-secondary);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.08);
    }

    .action-btn.danger:hover {
      border-color: var(--accent-danger);
      color: var(--accent-danger);
      background: rgba(239, 68, 68, 0.08);
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.12);
      background: rgba(6, 11, 20, 0.55);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }

    th {
      padding: 12px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(148, 163, 184, 0.15);
      background: rgba(255, 255, 255, 0.02);
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      color: var(--text-primary);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(0, 240, 255, 0.03);
    }

    .td-time {
      font-family: 'Orbitron', monospace;
      font-size: 0.78rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .td-qty {
      font-family: 'Orbitron', monospace;
      font-weight: 700;
      color: var(--accent-cyan);
      white-space: nowrap;
    }

    .td-qty span {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .del-row-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: color 0.2s;
    }

    .del-row-btn:hover {
      color: var(--accent-danger);
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: rgba(13, 22, 38, 0.95);
      border: 1px solid var(--accent-cyan);
      box-shadow: 0 0 24px rgba(0, 240, 255, 0.3);
      color: var(--text-primary);
      padding: 12px 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      font-weight: 500;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-emerald);
      box-shadow: 0 0 8px var(--accent-emerald);
    }

    @media (max-width: 600px) {
      .panel { padding: 20px 16px; }
      .header { padding: 14px 16px; }
      .clock { display: none; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Top HUD Bar -->
    <header class="header">
      <div class="brand">
        <div class="status-indicator"></div>
        <div class="brand-text">
          <h1 data-i18n="appTitle">生產數量回報系統</h1>
          <div class="brand-sub">MES // QUANTITY TELEMETRY v2.6</div>
        </div>
      </div>

      <div class="header-controls">
        <div class="clock" id="liveClock">00:00:00</div>
        <div class="lang-select-wrapper">
          <svg class="lang-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <select id="langSelect" class="lang-select" aria-label="Language">
            <option value="zh-TW">繁體中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="vi">Tiếng Việt</option>
            <option value="th">ภาษาไทย</option>
            <option value="id">Bahasa Indonesia</option>
          </select>
          <svg class="lang-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>
        </div>
      </div>
    </header>

    <!-- Main Input Card -->
    <main class="panel">
      <div class="corner corner-tl"></div>
      <div class="corner corner-tr"></div>
      <div class="corner corner-bl"></div>
      <div class="corner corner-br"></div>

      <form id="reportForm" class="form-grid">
        <!-- Part Name or Machine Tonnage -->
        <div class="form-group">
          <label for="partOrTonnage" class="form-label">
            <span data-i18n="partLabel">部品名稱或機台噸數</span>
            <span class="label-tag">ID // TONNAGE</span>
          </label>
          <div class="input-wrapper">
            <input
              type="text"
              id="partOrTonnage"
              class="input-field"
              list="presetList"
              autocomplete="off"
              required
              data-i18n-placeholder="partPlaceholder"
              placeholder="例如：外殼組件 A-102 或點選機台噸數"
            />
            <datalist id="presetList">
              <option value="1600T">
              <option value="1500T">
              <option value="1380T">
              <option value="850T">
              <option value="600(N)">
              <option value="600(O)">
              <option value="190T">
              <option value="110T">
            </datalist>
          </div>
          <div class="quick-pills" id="tonnagePills">
            <button type="button" class="pill-btn preset-item" data-val="1600T">1600T</button>
            <button type="button" class="pill-btn preset-item" data-val="1500T">1500T</button>
            <button type="button" class="pill-btn preset-item" data-val="1380T">1380T</button>
            <button type="button" class="pill-btn preset-item" data-val="850T">850T</button>
            <button type="button" class="pill-btn preset-item" data-val="600(N)">600(N)</button>
            <button type="button" class="pill-btn preset-item" data-val="600(O)">600(O)</button>
            <button type="button" class="pill-btn preset-item" data-val="190T">190T</button>
            <button type="button" class="pill-btn preset-item" data-val="110T">110T</button>
          </div>
        </div>

        <!-- Quantity (PCS) -->
        <div class="form-group">
          <label for="quantity" class="form-label">
            <span data-i18n="qtyLabel">生產數量</span>
            <span class="label-tag">UNIT // PCS</span>
          </label>
          <div class="input-wrapper">
            <input
              type="number"
              id="quantity"
              class="input-field input-qty"
              min="1"
              step="1"
              required
              placeholder="0"
            />
            <span class="unit-badge">PCS</span>
          </div>
          <div class="quick-pills">
            <button type="button" class="pill-btn qty-add" data-add="10">+10</button>
            <button type="button" class="pill-btn qty-add" data-add="50">+50</button>
            <button type="button" class="pill-btn qty-add" data-add="100">+100</button>
            <button type="button" class="pill-btn qty-add" data-add="500">+500</button>
            <button type="button" class="pill-btn qty-add" data-add="1000">+1000</button>
          </div>
        </div>

        <button type="submit" class="submit-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M22 2L11 13"></path>
            <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
          </svg>
          <span data-i18n="submitBtn">傳送回報數據</span>
        </button>
      </form>
    </main>

    <!-- Recent Telemetry Logs -->
    <section class="panel">
      <div class="log-header">
        <div class="log-title-wrap">
          <h2 class="log-title" data-i18n="logTitle">即時回報紀錄</h2>
          <span class="stats-badge" id="totalBadge">TOTAL: 0 PCS</span>
        </div>
        <div class="log-actions">
          <button type="button" class="action-btn" id="exportBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span data-i18n="exportBtn">匯出 CSV</span>
          </button>
          <button type="button" class="action-btn danger" id="clearBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span data-i18n="clearBtn">清空</span>
          </button>
        </div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th data-i18n="colTime">時間</th>
              <th data-i18n="colItem">部品名稱 / 機台噸數</th>
              <th data-i18n="colQty">數量</th>
              <th style="width: 44px;"></th>
            </tr>
          </thead>
          <tbody id="logTableBody"></tbody>
        </table>
        <div id="emptyState" class="empty-state" data-i18n="emptyMsg">尚無回報數據</div>
      </div>
    </section>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="toast">
    <div class="toast-dot"></div>
    <span id="toastMsg">回報成功</span>
  </div>

  <script>
    (function () {
      // Multi-language Dictionary
      const i18n = {
        "zh-TW": {
          appTitle: "生產數量回報系統",
          partLabel: "部品名稱或機台噸數",
          partPlaceholder: "例如：外殼組件 A-102 或點選機台噸數",
          qtyLabel: "生產數量",
          submitBtn: "傳送回報數據",
          logTitle: "即時回報紀錄",
          exportBtn: "匯出 CSV",
          clearBtn: "清空",
          colTime: "回報時間",
          colItem: "部品名稱 / 機台噸數",
          colQty: "數量",
          emptyMsg: "尚無回報數據，請於上方輸入並送出。",
          toastSuccess: "數據已成功上傳紀錄",
          confirmClear: "確定要清空所有本地紀錄嗎？"
        },
        "en": {

      const STORAGE_KEY = "nexus_qty_reports_v1";
      const LANG_KEY = "nexus_qty_lang_v1";

      // Safe localStorage wrapper to prevent crashes in restricted environments
      function safeGetStorage(key, fallback) {
        try {
          const val = window.localStorage.getItem(key);
          return val !== null ? val : fallback;
        } catch (e) {
          return fallback;
        }
      }

      function safeSetStorage(key, val) {
        try {
          window.localStorage.setItem(key, val);
        } catch (e) {
          // Fallback silently to in-memory state if storage is blocked
        }
      }

      let currentLang = safeGetStorage(LANG_KEY, "zh-TW");
      let logs = [];
      try {
        const parsed = JSON.parse(safeGetStorage(STORAGE_KEY, "[]"));
        if (Array.isArray(parsed)) logs = parsed;
      } catch (e) {
        logs = [];
      }

      const langSelect = document.getElementById("langSelect");
      const reportForm = document.getElementById("reportForm");
      const partInput = document.getElementById("partOrTonnage");
      const qtyInput = document.getElementById("quantity");
      const logTableBody = document.getElementById("logTableBody");
      const emptyState = document.getElementById("emptyState");
      const totalBadge = document.getElementById("totalBadge");
      const toast = document.getElementById("toast");
      const toastMsg = document.getElementById("toastMsg");
      const presetButtons = document.querySelectorAll(".preset-item");

      // Live Digital Clock
      function updateClock() {
        const clockEl = document.getElementById("liveClock");
        if (!clockEl) return;
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, "0");
        const mm = String(now.getMinutes()).padStart(2, "0");
        const ss = String(now.getSeconds()).padStart(2, "0");
        clockEl.textContent = `${hh}:${mm}:${ss}`;
      }
      setInterval(updateClock, 1000);
      updateClock();

      // Language Switcher
      function applyLanguage(lang) {
        currentLang = i18n[lang] ? lang : "zh-TW";
        safeSetStorage(LANG_KEY, currentLang);
        document.documentElement.lang = currentLang;

        if (langSelect.value !== currentLang) {
          langSelect.value = currentLang;
        }

        const dict = i18n[currentLang];
        document.querySelectorAll("[data-i18n]").forEach(el => {
          const key = el.getAttribute("data-i18n");
          if (dict[key]) el.textContent = dict[key];
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
          const key = el.getAttribute("data-i18n-placeholder");
          if (dict[key]) el.placeholder = dict[key];
        });
      }

      langSelect.addEventListener("change", function (e) {
        applyLanguage(e.target.value);
      });

      // Sync active pill visual state with input
      function syncActivePreset() {
        const val = partInput.value.trim();
        presetButtons.forEach(btn => {
          btn.classList.toggle("active", btn.dataset.val === val);
        });
      }

      partInput.addEventListener("input", syncActivePreset);

      // Quick Preset Buttons
      presetButtons.forEach(btn => {
        btn.addEventListener("click", function () {
          partInput.value = btn.dataset.val;
          syncActivePreset();
          qtyInput.focus();
        });
      });

      document.querySelectorAll(".qty-add").forEach(btn => {
        btn.addEventListener("click", function () {
          const current = parseInt(qtyInput.value, 10) || 0;
          qtyInput.value = current + parseInt(btn.dataset.add, 10);
        });
      });

      // Toast Helper
      let toastTimer;
      function showToast(msg) {
        toastMsg.textContent = msg;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
      }

      // Format Timestamp safely across all browsers
      function formatTimestamp(d) {
        const pad = n => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      }

      // Render Logs
      function renderLogs() {
        logTableBody.innerHTML = "";
        let totalPcs = 0;

        if (logs.length === 0) {
          emptyState.style.display = "block";
        } else {
          emptyState.style.display = "none";
          logs.forEach((item, index) => {
            totalPcs += Number(item.qty);
            const tr = document.createElement("tr");

            const tdTime = document.createElement("td");
            tdTime.className = "td-time";
            tdTime.textContent = item.time;

            const tdItem = document.createElement("td");
            tdItem.textContent = item.part;

            const tdQty = document.createElement("td");
            tdQty.className = "td-qty";
            tdQty.innerHTML = `${Number(item.qty).toLocaleString()}<span>PCS</span>`;

            const tdAction = document.createElement("td");
            const delBtn = document.createElement("button");
            delBtn.type = "button";
            delBtn.className = "del-row-btn";
            delBtn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
            delBtn.onclick = function () {
              logs.splice(index, 1);
              saveAndRender();
            };
            tdAction.appendChild(delBtn);

            tr.append(tdTime, tdItem, tdQty, tdAction);
            logTableBody.appendChild(tr);
          });
        }

        totalBadge.textContent = `TOTAL: ${totalPcs.toLocaleString()} PCS`;
      }

      function saveAndRender() {
        safeSetStorage(STORAGE_KEY, JSON.stringify(logs));
        renderLogs();
      }

      // Submit Form
      reportForm.addEventListener("submit", function (e) {
        e.preventDefault();
        const part = partInput.value.trim();
        const qty = parseInt(qtyInput.value, 10);

        if (!part || isNaN(qty) || qty <= 0) return;

        logs.unshift({
          time: formatTimestamp(new Date()),
          part: part,
          qty: qty
        });

        saveAndRender();
        showToast(`${i18n[currentLang].toastSuccess} (${part}: ${qty} PCS)`);

        qtyInput.value = "";
        partInput.focus();
      });

      // Clear Logs
      document.getElementById("clearBtn").addEventListener("click", function () {
        if (logs.length === 0) return;
        if (confirm(i18n[currentLang].confirmClear)) {
          logs = [];
          saveAndRender();
        }
      });

      // Export CSV (with UTF-8 BOM for Excel compatibility)
      document.getElementById("exportBtn").addEventListener("click", function () {
        if (logs.length === 0) return;
        const headers = ["Timestamp", "Part_or_Tonnage", "Quantity_PCS"];
        const rows = logs.map(l => [
          `"${l.time}"`,
          `"${String(l.part).replace(/"/g, '""')}"`,
          l.qty
        ].join(","));

        const csvContent = "\uFEFF" + [headers.join(","), ...rows].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `quantity_report_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // Initialize
      applyLanguage(currentLang);
      renderLogs();
    })();
  </script>
